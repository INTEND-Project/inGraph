version: '3.8'

services:
  # GraphDB Service
  graphdb:
    image: ontotext/graphdb:10.6.2
    container_name: graphdb-prod-container
    ports:
      - "7200:7200"
    environment:
      - GDB_HEAP_SIZE=4g
      - GDB_JAVA_OPTS=-Xmx4g -Xms2g
    volumes:
      - graphdb_prod_data:/opt/graphdb/home
      - graphdb_prod_work:/opt/graphdb/work
    networks:
      - kg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Knowledge Graph Web Interface Service - Production
  kg-visualizer:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kg-visualizer-prod-container
    ports:
      - "80:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - GRAPHDB_BASE_URL=http://graphdb:7200
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    networks:
      - kg-network
    depends_on:
      graphdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes for GraphDB data persistence
volumes:
  graphdb_prod_data:
    driver: local
  graphdb_prod_work:
    driver: local

# Custom network for service communication
networks:
  kg-network:
    driver: bridge
